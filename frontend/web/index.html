<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Al Hassan Online Quran Academy — Quran recitation, Tajweed, memorization, and a connected learning community.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Al Hassan">
  <meta name="theme-color" content="#145B45">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="brand.svg"/>

  <title>Al Hassan | Online Quran Academy</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#f8f7f2">
  <noscript>Please enable JavaScript to open Al Hassan Online Quran Academy.</noscript>
  <div id="loading" role="status" style="position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#145b45;font-family:Georgia,serif"><div style="font-size:30px">Al Hassan</div><p style="font:11px Arial;letter-spacing:3px">ONLINE QURAN ACADEMY</p><p style="font:12px Arial;color:#77867d">Preparing your learning space…</p></div>
  <script>window.addEventListener("flutter-first-frame", () => document.getElementById("loading")?.remove());</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
