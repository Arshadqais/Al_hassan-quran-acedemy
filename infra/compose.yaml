services:
  postgres:
    image: postgres:17
    container_name: quran_academy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quran_academy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d quran_academy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
